name: CI

on:
  push:
    # Every agent branch gets build + test feedback (the package and release jobs stay on main/tags).
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # 2.4.0 performance budget. Baselines are the v2.3.0 release assets (the same build main ships):
  # DropWheel-Setup.exe 62,967,948 bytes and DropWheel-2.3.0-portable-win-x64.zip 89,266,161 bytes.
  # A package that grows by >= 6 MiB fails the build. Bump these only with a new release baseline.
  BASELINE_SETUP_BYTES: "62967948"
  BASELINE_PORTABLE_BYTES: "89266161"
  SIZE_BUDGET_BYTES: "6291456"

jobs:
  build-test:
    name: Build + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure .NET 10 SDK
        shell: pwsh
        run: |
          # windows-latest already ships a recent SDK; only install if .NET 10 is missing.
          # (actions/setup-dotnet can hang fetching the SDK, so it is not used here.)
          $sdks = dotnet --list-sdks
          $sdks | Write-Host
          if (-not ($sdks -match '^10\.')) {
            Write-Host "No .NET 10 SDK on the image; installing one."
            choco install dotnet-10.0-sdk --no-progress -y
            refreshenv
          }
          dotnet --version

      - name: Restore
        shell: pwsh
        run: |
          # In a multi-line pwsh step only the LAST command's exit code decides success, so every
          # command is checked explicitly (a failing App build once slipped through this way).
          dotnet restore src/FileAction.App/FileAction.App.csproj
          if ($LASTEXITCODE -ne 0) { throw "restore App failed" }
          dotnet restore tests/FileAction.Tests/FileAction.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw "restore Tests failed" }

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/FileAction.Core/FileAction.Core.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "build Core failed" }
          dotnet build src/FileAction.App/FileAction.App.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "build App failed" }
          dotnet build tests/FileAction.Tests/FileAction.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "build Tests failed" }

      - name: Dependency allowlist (ship set + ZXing.Net only)
        shell: pwsh
        run: |
          # The 2.4.0 ship set is frozen: a new package reference in Core or the app must be a deliberate,
          # reviewed decision, not a side effect of a tool merge. ZXing.Net (QR) is the only allowed addition.
          # This runs before the publish so a PR cannot even reach the size budget with a new dependency.
          $allowed = @(
            'ClosedXML'
            'ExcelDataReader'
            'Magick.NET-Q8-AnyCPU'
            'PdfPig'
            'PDFsharp'
            'PDFtoImage'
            'SharpCompress'
            'System.Security.Cryptography.Pkcs'
            'ZXing.Net'
          )
          $projects = @(
            'src/FileAction.Core/FileAction.Core.csproj'
            'src/FileAction.App/FileAction.App.csproj'
          )
          $rows = @()
          foreach ($project in $projects) {
            [xml] $xml = Get-Content -LiteralPath $project -Raw
            # Enumerating .PackageReference across ItemGroups also yields $null for groups without one.
            $references = @($xml.Project.ItemGroup.PackageReference |
              Where-Object { $_ -is [System.Xml.XmlElement] -and $_.Include })
            if ($references.Count -eq 0) {
              $rows += "| $project | (none) | |"
              continue
            }
            foreach ($reference in $references) {
              $name = [string] $reference.Include
              $version = [string] $reference.Version
              $rows += "| $project | $name | $version |"
              if ($allowed -notcontains $name) {
                throw "new package reference '$name $version' in $project; the 2.4.0 ship set allows only: $($allowed -join ', ')"
              }
            }
          }
          "### Ship-set package references" >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          '| project | package | version |' >> $env:GITHUB_STEP_SUMMARY
          '| --- | --- | --- |' >> $env:GITHUB_STEP_SUMMARY
          $rows | ForEach-Object { $_ >> $env:GITHUB_STEP_SUMMARY; Write-Host $_ }
          Write-Host "package reference guard: $($rows.Count) reference(s), all in the allowlist"

      - name: Lazy tool registration guard
        shell: pwsh
        run: |
          # Every tool registers itself from a [ModuleInitializer]. That initializer may only call
          # ToolRegistry.Register(<singleton>) so app start builds a lightweight spec; the view (Magick,
          # PDFsharp, ffmpeg, bitmaps, ToolWindow) must be built by Create() when the tool opens.
          $failures = New-Object System.Collections.Generic.List[string]
          $checked = 0
          foreach ($file in (Get-ChildItem src -Recurse -Filter *.cs)) {
            $text = Get-Content -LiteralPath $file.FullName -Raw
            $offset = 0
            while (($index = $text.IndexOf('[ModuleInitializer]', $offset, [System.StringComparison]::Ordinal)) -ge 0) {
              $checked++
              $offset = $index + 1
              $rest = $text.Substring($index)
              $signature = [regex]::Match($rest,
                'internal\s+static\s+void\s+[A-Za-z_][A-Za-z0-9_]*\s*\(\s*\)')
              if (-not $signature.Success) {
                $failures.Add("$($file.FullName): [ModuleInitializer] is not an internal static parameterless void method")
                continue
              }
              $after = $rest.Substring($signature.Index + $signature.Length)
              if ($after -match '^\s*=>') {
                $body = ($after -split ';', 2)[0]
                $body = ($body -replace '^\s*=>', '').Trim()
              } elseif ($after -match '^\s*\{') {
                $depth = 0
                $end = -1
                for ($i = 0; $i -lt $after.Length; $i++) {
                  if ($after[$i] -eq '{') { $depth++ }
                  elseif ($after[$i] -eq '}') { $depth--; if ($depth -eq 0) { $end = $i; break } }
                }
                if ($end -lt 0) {
                  $failures.Add("$($file.FullName): unterminated [ModuleInitializer] body")
                  continue
                }
                $body = $after.Substring(1, $end - 1).Trim()
              } else {
                $failures.Add("$($file.FullName): [ModuleInitializer] has no recognizable body")
                continue
              }
              if ($body -notmatch '^ToolRegistry\.Register\(\s*(new\s+[A-Za-z_][A-Za-z0-9_.]*\s*\(\s*\)|[A-Za-z_][A-Za-z0-9_.]*\.Instance)\s*\)$') {
                $failures.Add("$($file.FullName): [ModuleInitializer] body must be exactly ToolRegistry.Register(new XTool())/Register(XTool.Instance), got: $body")
              }
            }
          }
          if ($checked -eq 0) { throw 'no [ModuleInitializer] tool registrations found' }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host $_ }
            throw "$($failures.Count) tool registration(s) do more than ToolRegistry.Register(...)"
          }
          Write-Host "lazy registration guard: $checked module initializer(s) only register a spec"

      - name: Guard against reflection-based JSON
        shell: pwsh
        run: |
          # Kept as a guard for any future trimming experiment: generic System.Text.Json calls need
          # reflection metadata that trimming can remove. Use a JsonSerializerContext or JsonDocument.
          $hits = Get-ChildItem src -Recurse -Filter *.cs |
            Select-String -Pattern 'JsonSerializer\.(Deserialize|Serialize)<'
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw "Reflection-based JsonSerializer call; use a JsonSerializerContext or JsonDocument."
          }

      - name: Self-contained UI self-test (shipped publish)
        shell: pwsh
        timeout-minutes: 15
        run: |
          # This is the exact shape the installer ships. The framework-dependent screenshot job cannot
          # catch packaging/resource regressions, so the self-contained build renders every window here.
          dotnet publish src/FileAction.App/FileAction.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -o release/selfcontained
          if ($LASTEXITCODE -ne 0) { throw "self-contained publish failed" }
          $out = "release/self-test"
          $process = Start-Process -FilePath release/selfcontained/DropWheel.exe `
            -ArgumentList '--self-test', $out -PassThru -Wait
          $log = Join-Path $out 'self-test.txt'
          if (Test-Path $log) {
            Get-Content $log | Select-Object -Last 60
            # The performance budgets and their measured actuals go to the job summary, so cold-start,
            # idle-memory and per-tool deltas are visible on the PR check without opening the log.
            $text = Get-Content $log -Raw
            $perf = @($text -split "`r?`n" | Where-Object { $_ -match '^(perf|ok tools/lazy|note tools/lazy|ok tools/ffmpeg|ok tools/temp|FAILED tools/)' })
            if ($perf.Count -gt 0) {
              '### Self-test performance budgets' >> $env:GITHUB_STEP_SUMMARY
              '' >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
              $perf | ForEach-Object { $_ >> $env:GITHUB_STEP_SUMMARY }
              '```' >> $env:GITHUB_STEP_SUMMARY
              $perf | ForEach-Object { Write-Host $_ }
            }
          } else {
            Write-Warning "self-contained --self-test wrote no self-test.txt"
          }
          if ($process.ExitCode -ne 0) { throw "self-contained --self-test failed with $($process.ExitCode)" }

      - name: No OCR/ML model payload (shipped publish)
        shell: pwsh
        run: |
          # The 2.4.0 payload must stay model-free: OCR uses the Windows recognizer and any optional
          # download must stay on-demand. The installer and the portable zip are both a copy of this
          # publish, so scanning it covers both shipped payloads.
          $payload = 'release/selfcontained'
          if (-not (Test-Path -LiteralPath $payload)) { throw "publish folder missing: $payload" }
          $models = @(Get-ChildItem $payload -Recurse -File | Where-Object {
            $_.Extension -in @('.onnx', '.tflite', '.model', '.pb') -or
            ($_.Extension -eq '.bin' -and $_.Length -gt 1MB)
          })
          $tessdata = @(Get-ChildItem $payload -Recurse -Directory | Where-Object { $_.Name -ieq 'tessdata' })
          $bundledTools = @(Get-ChildItem $payload -Recurse -File | Where-Object {
            $_.Name -in @('ffmpeg.exe', 'ffprobe.exe', 'pandoc.exe')
          })
          if ($models.Count -gt 0 -or $tessdata.Count -gt 0 -or $bundledTools.Count -gt 0) {
            $models | ForEach-Object { Write-Host "model file: $($_.FullName) ($($_.Length) bytes)" }
            $tessdata | ForEach-Object { Write-Host "tessdata: $($_.FullName)" }
            $bundledTools | ForEach-Object { Write-Host "on-demand tool bundled: $($_.FullName)" }
            throw "the shipped payload contains an OCR/ML model, tessdata, or an on-demand tool binary"
          }
          $files = @(Get-ChildItem $payload -Recurse -File).Count
          Write-Host "payload guard: $files files, no OCR/ML model, no tessdata, no bundled ffmpeg/pandoc"

      - name: Upload self-contained self-test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-contained-self-test
          path: release/self-test/**
          if-no-files-found: warn
          retention-days: 14


      - name: Verify UI coverage report (en + ar, every window)
        shell: pwsh
        run: |
          # The self-test itself exits non-zero on any coverage failure; this step makes "the report was
          # written" and "all 26 tools appear in both cultures" part of the job result as well.
          $report = "release/self-test/ui-coverage/ui-coverage.md"
          if (-not (Test-Path $report)) { throw "ui-coverage.md was not written; the coverage pass did not run" }
          $text = Get-Content $report -Raw
          if ($text -match '\| FAIL \|') { throw "ui-coverage.md contains FAIL rows" }
          $toolRows = ([regex]::Matches($text, '\| `tool:tools\.')).Count
          if ($toolRows -lt 52) { throw "ui-coverage.md has only $toolRows tool/culture rows; expected 52 (26 tools x en/ar)" }
          if ($text -notmatch 'Not covered by this run') { throw "ui-coverage.md has no explicit uncovered section" }
          Write-Host "ui-coverage: $toolRows tool/culture rows, no FAIL rows"

      - name: Upload UI coverage (en + ar, every window)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: |
            release/self-test/ui-coverage/**
          if-no-files-found: warn
          retention-days: 14

      - name: Install Inno Setup (PR size budget)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          # windows-latest usually ships Inno Setup; only install it when ISCC is really missing, so a
          # flaky Chocolatey feed cannot turn the PR size check into a false failure.
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          if ($candidates | Where-Object { Test-Path -LiteralPath $_ }) {
            Write-Host 'Inno Setup already installed'
            exit 0
          }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'choco install innosetup failed' }

      - name: Size budget (PR check)
        if: github.event_name == 'pull_request'
        timeout-minutes: 10
        shell: pwsh
        run: |
          # The PR runs the same installer + portable zip build the package job runs, but reuses the
          # self-contained publish from the self-test step. Baseline is the v2.3.0 release asset.
          ./scripts/build-installer.ps1 -SkipPublish
          if ($LASTEXITCODE -ne 0) { throw "build-installer.ps1 failed with exit code $LASTEXITCODE" }

          [xml] $csproj = Get-Content src/FileAction.App/FileAction.App.csproj
          $version = ($csproj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $setup = Get-Item "release/DropWheel-$version-Setup.exe"

          New-Item -ItemType Directory -Path portable -Force | Out-Null
          Copy-Item -Path release/selfcontained -Destination portable/DropWheel -Recurse -Force
          Set-Content portable/DropWheel/portable.txt "DropWheel portable build: settings and downloaded tools stay in this folder."
          Compress-Archive -Path portable/DropWheel/* -DestinationPath "release/DropWheel-$version-portable-win-x64.zip" -Force
          $portable = Get-Item "release/DropWheel-$version-portable-win-x64.zip"

          $baselineSetup = [long] $env:BASELINE_SETUP_BYTES
          $baselinePortable = [long] $env:BASELINE_PORTABLE_BYTES
          $budget = [long] $env:SIZE_BUDGET_BYTES
          $setupDelta = $setup.Length - $baselineSetup
          $portableDelta = $portable.Length - $baselinePortable
          $format = { param($bytes) '{0:N0} B ({1:N2} MB)' -f $bytes, ($bytes / 1MB) }

          @"
          ### Size budget (PR check)

          | package | v2.3.0 baseline | current | delta | +6 MiB limit |
          | --- | ---: | ---: | ---: | ---: |
          | installer | $(& $format $baselineSetup) | $(& $format $setup.Length) | $(& $format $setupDelta) | $(& $format $budget) |
          | portable zip | $(& $format $baselinePortable) | $(& $format $portable.Length) | $(& $format $portableDelta) | $(& $format $budget) |
          "@ >> $env:GITHUB_STEP_SUMMARY
          Write-Host "installer: $($setup.Length) bytes (baseline $baselineSetup, delta $setupDelta)"
          Write-Host "portable:  $($portable.Length) bytes (baseline $baselinePortable, delta $portableDelta)"
          if ($setupDelta -ge $budget) {
            throw "installer grew by $setupDelta bytes (>= $budget); the 2.4.0 size budget is +6 MiB over v2.3.0"
          }
          if ($portableDelta -ge $budget) {
            throw "portable zip grew by $portableDelta bytes (>= $budget); the 2.4.0 size budget is +6 MiB over v2.3.0"
          }


      - name: Update signing self-test
        shell: pwsh
        run: |
          if (Test-Path scripts/sign-release.ps1) { ./scripts/sign-release.ps1 -SelfTest }
          else { Write-Host "signing script not present yet; skipped" }

      - name: Apply-update helper (portable)
        timeout-minutes: 10
        shell: pwsh
        run: |
          if (Test-Path scripts/test-update-apply.ps1) { & ./scripts/test-update-apply.ps1 }
          else { Write-Host "update-apply test script not present yet; skipped" }

      - name: Install FFmpeg and Pandoc (integration tests)
        # Best effort: the community Chocolatey feed regularly answers 503. The integration tests skip the
        # samples whose tool is missing, so a feed outage must not turn the build red.
        continue-on-error: true
        shell: pwsh
        run: |
          choco install ffmpeg pandoc --no-progress -y
          $env:PATH = "$env:PATH;$env:ProgramData\chocolatey\bin"
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { ffmpeg -version | Select-Object -First 1 }
          else { Write-Warning "ffmpeg is not available; its samples will be skipped" }
          if (Get-Command pandoc -ErrorAction SilentlyContinue) { pandoc --version | Select-Object -First 1 }
          else { Write-Warning "pandoc is not available; its samples will be skipped" }

      - name: Test
        shell: pwsh
        run: >
          dotnet test tests/FileAction.Tests/FileAction.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package (self-contained setup + portable zip)
    needs: build-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure .NET 10 SDK
        shell: pwsh
        run: |
          # windows-latest already ships a recent SDK; only install if .NET 10 is missing.
          # (actions/setup-dotnet can hang fetching the SDK, so it is not used here.)
          $sdks = dotnet --list-sdks
          $sdks | Write-Host
          if (-not ($sdks -match '^10\.')) {
            Write-Host "No .NET 10 SDK on the image; installing one."
            choco install dotnet-10.0-sdk --no-progress -y
            refreshenv
          }
          dotnet --version

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src/FileAction.App/FileAction.App.csproj
          $version = ($csproj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $version) { throw "no <Version> in FileAction.App.csproj" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "version = $version"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (self-contained publish + ISCC)
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Shipped payload guard (no OCR/ML models, no bundled tools)
        shell: pwsh
        run: |
          # The shipped installer and portable zip are both a copy of release/selfcontained. Fail before
          # packaging if a tool merge slipped a model file, tessdata or an on-demand tool binary in.
          $payload = 'release/selfcontained'
          $models = @(Get-ChildItem $payload -Recurse -File | Where-Object {
            $_.Extension -in @('.onnx', '.tflite', '.model', '.pb') -or
            ($_.Extension -eq '.bin' -and $_.Length -gt 1MB)
          })
          $tessdata = @(Get-ChildItem $payload -Recurse -Directory | Where-Object { $_.Name -ieq 'tessdata' })
          $bundledTools = @(Get-ChildItem $payload -Recurse -File | Where-Object {
            $_.Name -in @('ffmpeg.exe', 'ffprobe.exe', 'pandoc.exe')
          })
          if ($models.Count -gt 0 -or $tessdata.Count -gt 0 -or $bundledTools.Count -gt 0) {
            $models | ForEach-Object { Write-Host "model file: $($_.FullName) ($($_.Length) bytes)" }
            $tessdata | ForEach-Object { Write-Host "tessdata: $($_.FullName)" }
            $bundledTools | ForEach-Object { Write-Host "on-demand tool bundled: $($_.FullName)" }
            throw "the shipped payload contains an OCR/ML model, tessdata, or an on-demand tool binary"
          }
          Write-Host "shipped payload guard: no OCR/ML model, no tessdata, no bundled ffmpeg/pandoc"

      - name: Self-test the exact packaged publish
        shell: pwsh
        timeout-minutes: 15
        run: |
          # release/selfcontained is the folder ISCC packages and the portable zip copies. Run the UI gate
          # here, on those exact files, instead of only on a separate build-test publish.
          $out = "release/shipped-self-test"
          if (Test-Path $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          $process = Start-Process -FilePath release/selfcontained/DropWheel.exe `
            -ArgumentList '--self-test', $out -PassThru -Wait
          $log = Join-Path $out 'self-test.txt'
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 30 }
          if ($process.ExitCode -ne 0) { throw "shipped --self-test failed with $($process.ExitCode)" }
          if (-not (Test-Path $log)) { throw "shipped --self-test wrote no self-test.txt" }
          $text = Get-Content $log -Raw
          if ($text -match 'FAILED:.*raw localization key') {
            throw "a rendered window contains a raw localization key (see self-test.txt)"
          }
          $keyLines = [regex]::Matches($text, 'localization:\s+(\d+) keys')
          if ($keyLines.Count -eq 0) { throw "self-test did not report the Loc key count" }
          foreach ($match in $keyLines) {
            if ([int] $match.Groups[1].Value -eq 0) { throw "Loc tables loaded 0 keys" }
          }
          if ($text -notmatch 'ok settings\.json file load/save') {
            throw "shipped self-test did not exercise settings.json load/save"
          }

      - name: Upload shipped-publish self-test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-self-test
          path: release/shipped-self-test/self-test.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Clean the self-test profile
        if: always()
        shell: pwsh
        run: |
          # The self-test runs the app normally, so it creates %APPDATA%\DropWheel. The installer smoke
          # test asserts a clean machine; remove exactly the folders the app may have created.
          foreach ($dir in @(
            (Join-Path $env:APPDATA 'DropWheel'),
            (Join-Path $env:LOCALAPPDATA 'DropWheel')
          )) {
            if (Test-Path -LiteralPath $dir) {
              Remove-Item -LiteralPath $dir -Recurse -Force
              Write-Host "removed $dir"
            }
          }

      - name: Installer silent install/uninstall smoke test
        shell: pwsh
        run: |
          # This is the only step that exercises the installed bytes, so it must never be skipped:
          # a missing script fails the job instead of silently dropping the gate.
          if (-not (Test-Path -LiteralPath 'scripts/test-installer.ps1')) {
            throw 'scripts/test-installer.ps1 is missing; the installer smoke test cannot be skipped.'
          }
          & ./scripts/test-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "test-installer.ps1 failed with exit code $LASTEXITCODE" }

      # R-23: a truly portable build — the same self-contained, untrimmed publish the installer uses,
      # so it runs with no .NET install, no installer, no registry, no admin.
      - name: Portable zip (self-contained, no admin)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Path portable -Force | Out-Null
          Copy-Item -Path release/selfcontained -Destination portable/DropWheel -Recurse -Force
          if (-not (Test-Path portable/DropWheel/DropWheel.exe)) { throw "portable staging has no DropWheel.exe" }
          Set-Content portable/DropWheel/portable.txt "DropWheel portable build: settings and downloaded tools stay in this folder."
          Compress-Archive -Path portable/DropWheel/* -DestinationPath "release/DropWheel-$version-portable-win-x64.zip" -Force
          $zip = Get-Item "release/DropWheel-$version-portable-win-x64.zip"
          Write-Host ("portable self-contained zip: {0:N1} MB" -f ($zip.Length / 1MB))

      - name: Size report
        shell: pwsh
        run: |
          # 2.4.0 size budget: the packaged installer and the portable zip may not grow by >= 6 MiB over
          # the v2.3.0 release assets (DropWheel-Setup.exe 62,967,948 bytes and the portable zip
          # 89,266,161 bytes, both hard-coded in the workflow env above). This step prints both baseline
          # and current numbers to the log and the job summary, and fails the package job on a regression.
          $version = "${{ steps.version.outputs.version }}"
          $publish = Get-ChildItem release/selfcontained -Recurse -File
          $publishBytes = ($publish | Measure-Object Length -Sum).Sum
          $setup = Get-Item "release/DropWheel-$version-Setup.exe"
          $portable = Get-Item "release/DropWheel-$version-portable-win-x64.zip"
          $baselineSetup = [long] $env:BASELINE_SETUP_BYTES
          $baselinePortable = [long] $env:BASELINE_PORTABLE_BYTES
          $budget = [long] $env:SIZE_BUDGET_BYTES
          $setupDelta = $setup.Length - $baselineSetup
          $portableDelta = $portable.Length - $baselinePortable

          @"
          ### DropWheel $version package sizes (v2.3.0 baseline)

          | item | v2.3.0 baseline | current | delta | +6 MiB limit |
          | --- | ---: | ---: | ---: | ---: |
          | installer | $([math]::Round($baselineSetup / 1MB, 2)) MB | $([math]::Round($setup.Length / 1MB, 2)) MB | $([math]::Round($setupDelta / 1MB, 2)) MB | $([math]::Round($budget / 1MB, 2)) MB |
          | portable zip | $([math]::Round($baselinePortable / 1MB, 2)) MB | $([math]::Round($portable.Length / 1MB, 2)) MB | $([math]::Round($portableDelta / 1MB, 2)) MB | $([math]::Round($budget / 1MB, 2)) MB |
          | publish (self-contained, untrimmed, win-x64) | - | $([math]::Round($publishBytes / 1MB, 1)) MB | - | - |
          | publish files | - | $($publish.Count) | - | - |
          "@ >> $env:GITHUB_STEP_SUMMARY

          Write-Host ("installer: {0:N0} bytes (baseline {1:N0}, delta {2:N0})" -f $setup.Length, $baselineSetup, $setupDelta)
          Write-Host ("portable:  {0:N0} bytes (baseline {1:N0}, delta {2:N0})" -f $portable.Length, $baselinePortable, $portableDelta)
          Write-Host ("publish:   {0:N1} MB / {1} files" -f ($publishBytes / 1MB), $publish.Count)
          if ($setupDelta -ge $budget) {
            throw "installer grew by $setupDelta bytes (>= $budget); the 2.4.0 size budget is +6 MiB over the v2.3.0 setup asset"
          }
          if ($portableDelta -ge $budget) {
            throw "portable zip grew by $portableDelta bytes (>= $budget); the 2.4.0 size budget is +6 MiB over the v2.3.0 portable asset"
          }

      # docs/PERF.md makes "the installer and the portable zip may not grow by 6 MiB or more over
      # v2.3.0" a hard budget, but until now the two sizes were only PRINTED, so a regression could
      # ship with a green job. This asserts the documented rule on the exact files that are uploaded.
      # Baseline = the published v2.3.0 release assets (bytes), i.e.
      # https://github.com/Faisaldhd/dropwheel/releases/tag/v2.3.0 -> DropWheel-2.3.0-Setup.exe
      # 62,967,948 B and DropWheel-2.3.0-portable-win-x64.zip 89,266,161 B.
      - name: Package size budget (v2.3.0 baseline, +6 MiB fails)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $baselines = [ordered]@{
            'setup'        = 62967948
            'portable zip' = 89266161
          }
          # "6 MiB or more" is the fail rule, so a delta >= 6 MiB fails and exactly +6 MiB is red.
          $limitBytes = 6MB
          $assets = [ordered]@{
            'setup'        = "release/DropWheel-$version-Setup.exe"
            'portable zip' = "release/DropWheel-$version-portable-win-x64.zip"
          }

          $rows = @()
          $breached = @()
          foreach ($name in $baselines.Keys) {
            $path = $assets[$name]
            if (-not (Test-Path -LiteralPath $path)) { throw "size budget: $path does not exist" }
            $bytes = (Get-Item -LiteralPath $path).Length
            $base = $baselines[$name]
            $delta = $bytes - $base
            $deltaMb = [math]::Round($delta / 1MB, 2)
            $deltaPct = [math]::Round(($delta / $base) * 100, 2)
            $verdict = if ($delta -ge $limitBytes) { 'FAIL' } else { 'PASS' }
            Write-Host ("{0}: {1:N0} B vs v2.3.0 {2:N0} B -> {3} MiB ({4} %) {5}" -f `
              $name, $bytes, $base, $deltaMb, $deltaPct, $verdict)
            $rows += "| $name | $bytes | $base | $deltaMb MiB | $deltaPct % | $verdict |"
            if ($verdict -eq 'FAIL') { $breached += $name }
          }

          $summary = @(
            '### Package size budget (v2.3.0 baseline)',
            '',
            'Fail rule: a delta of **+6 MiB or more** over v2.3.0 (`docs/PERF.md`).',
            '',
            '| asset | bytes | v2.3.0 bytes | delta | delta % | verdict |',
            '| --- | ---: | ---: | ---: | ---: | --- |'
          ) + $rows
          $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          if ($breached.Count -gt 0) {
            throw ("package size budget breached for {0}: grew by 6 MiB or more over v2.3.0" -f ($breached -join ', '))
          }

      - name: SHA256SUMS
        if: always()
        shell: pwsh
        run: |
          # Exactly two binary assets remain: the setup exe and the self-contained portable zip.
          $files = @(Get-ChildItem release -File | Where-Object {
            $_.Name -like 'DropWheel-*-Setup.exe' -or $_.Name -like 'DropWheel-*-portable-win-x64.zip'
          })
          if ($files.Count -ne 2) {
            throw "expected the setup exe and the self-contained portable zip, found: $($files.Name -join ', ')"
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt
      - name: Upload setup
        uses: actions/upload-artifact@v4
        with:
          name: DropWheel-Setup-${{ steps.version.outputs.version }}
          path: |
            release/DropWheel-*-Setup.exe
            release/DropWheel-*-portable-win-x64.zip
            release/SHA256SUMS.txt
          retention-days: 14

      - name: Diagnose report
        shell: pwsh
        run: |
          # R-18: the report is what the owner sends back when the app misbehaves on a locked-down PC.
          # DropWheel is a GUI subsystem exe: "& exe" does not wait and leaves $LASTEXITCODE stale, so use
          # Start-Process -Wait and verify the report file instead of the shell's exit code.
          $process = Start-Process -FilePath release/selfcontained/DropWheel.exe `
            -ArgumentList '--diagnose', (Join-Path $PWD 'release/diagnose.txt') -PassThru
          if (-not $process.WaitForExit(90000)) { Write-Warning 'diagnose did not exit in 90 s'; try { $process.Kill($true) } catch { } }
          Write-Host "diagnose exit code: $($process.ExitCode)"
          if (-not (Test-Path release/diagnose.txt)) { throw "--diagnose wrote no report" }
          $report = Get-Content release/diagnose.txt -Raw
          Get-Content release/diagnose.txt | Select-Object -First 40
          if ($process.ExitCode -ne 0) { throw "--diagnose failed with $($process.ExitCode)" }
          $localeMatch = [regex]::Match($report, 'localization: English=(\d+) keys, Arabic=(\d+) keys')
          if (-not $localeMatch.Success) { throw "diagnose did not report both Loc table counts" }
          $englishKeys = [int] $localeMatch.Groups[1].Value
          $arabicKeys = [int] $localeMatch.Groups[2].Value
          if ($englishKeys -eq 0 -or $arabicKeys -eq 0) {
            throw "diagnose reports an empty Loc table (English=$englishKeys, Arabic=$arabicKeys)"
          }
          if ($report -match 'localization:.*ERROR') { throw "diagnose reports a localization error" }
          $keyMatch = [regex]::Match($report, 'strings:\s+(\d+) keys')
          if (-not $keyMatch.Success) { throw "diagnose did not report the active Loc key count" }
          if ([int] $keyMatch.Groups[1].Value -eq 0) { throw "diagnose reports 0 active Loc keys" }
          if ($report -match 'settings\.title="settings\.title"') { throw "diagnose reports a raw settings.title" }

      - name: Upload diagnose
        uses: actions/upload-artifact@v4
        with:
          name: diagnose
          path: release/diagnose.txt
          retention-days: 14

  release:
    name: GitHub release (tag)
    # R-24/R-26: pushing a vX.Y.Z tag publishes exactly six assets: the self-contained portable zip and its
    # signature, the installer under its versioned name and under the stable DropWheel-Setup.exe alias, the
    # installer signature, and SHA256SUMS.txt. Everything else in dist (test-results, diagnose.txt,
    # screenshots) is deliberately never released.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage, sign and verify the six release assets
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          # PowerShell 7.4+ can turn a native non-zero exit into a terminating error; gh is probed below.
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          # Only the versioned installer and the self-contained portable zip come out of dist. The name shape
          # is exact, so test-results, diagnose.txt and screenshots can never be staged by accident.
          $setup = @(Get-ChildItem dist -Recurse -File | Where-Object {
            $_.Name -match '^DropWheel-([0-9]+(\.[0-9]+)+)-Setup\.exe$' -or
            $_.Name -match '^DropWheel-Setup-([0-9]+(\.[0-9]+)+)\.exe$' })
          $portable = @(Get-ChildItem dist -Recurse -File | Where-Object {
            $_.Name -match '^DropWheel-([0-9]+(\.[0-9]+)+)-portable-win-x64\.zip$' })
          if ($setup.Count -ne 1) {
            throw "expected exactly one DropWheel-<ver>-Setup.exe in dist, found: $($setup.Name -join ', ')"
          }
          if ($portable.Count -ne 1) {
            throw "expected exactly one DropWheel-<ver>-portable-win-x64.zip in dist, found: $($portable.Name -join ', ')"
          }
          if ($setup[0].Name -match '^DropWheel-([0-9]+(\.[0-9]+)+)-Setup\.exe$') {
            $packageVersion = $Matches[1]
          } else {
            $packageVersion = $setup[0].Name -replace '^DropWheel-Setup-(.*)\.exe$', '$1'
          }
          if ($portable[0].Name -ne "DropWheel-$packageVersion-portable-win-x64.zip") {
            throw "package artifacts disagree: $($setup[0].Name) vs $($portable[0].Name)"
          }

          # Assets are normalized to the *packaged* version, so the release publishes the same six names
          # whatever the tag looks like (the updater finds them through UpdateConfig.SetupAssetName /
          # PortableAssetName of the version it reads from the tag). A tag that disagrees with the build
          # only warns; the versioned setup is renamed from DropWheel-Setup-<v>.exe to DropWheel-<v>-Setup.exe.
          $tag = $env:GITHUB_REF_NAME
          $version = $packageVersion
          if ($tag -ne "v$version") {
            Write-Warning "tag $tag does not match the packaged version $version; naming the assets after the package"
          }
          Write-Host "staging DropWheel $version for tag $tag"
          "VERSION=$version" >> $env:GITHUB_ENV

          $stage = Join-Path $env:RUNNER_TEMP 'release-assets'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          # Inno Setup now emits DropWheel-<version>-Setup.exe directly; an older build may still emit
          # DropWheel-Setup-<version>.exe. Either way the staged asset is the updater's exact name. The
          # stable DropWheel-Setup.exe copy is byte-for-byte the same file.
          $versionedSetup = Join-Path $stage "DropWheel-$version-Setup.exe"
          $versionedZip = Join-Path $stage "DropWheel-$version-portable-win-x64.zip"
          Copy-Item -LiteralPath $setup[0].FullName -Destination $versionedSetup
          Copy-Item -LiteralPath $portable[0].FullName -Destination $versionedZip
          $stableSetup = Join-Path $stage 'DropWheel-Setup.exe'
          Copy-Item -LiteralPath $versionedSetup -Destination $stableSetup
          if ((Get-FileHash $stableSetup -Algorithm SHA256).Hash -ne
              (Get-FileHash $versionedSetup -Algorithm SHA256).Hash) {
            throw 'DropWheel-Setup.exe is not a byte-for-byte copy of the versioned installer'
          }

          # Sign both binaries with the repository secret (base64 PKCS#8, ECDSA P-256). The .sig is what
          # UpdateVerifier expects: base64 of ECDsa.SignHash(SHA256 over the file bytes), default P1363,
          # ASCII, no newline. Verify each one against the public key constant compiled into the app
          # (UpdateKey.PublicKeyBase64) before anything is uploaded; a mismatch fails the job.
          if (-not $env:UPDATE_SIGNING_KEY) {
            throw 'UPDATE_SIGNING_KEY is not set; refusing to publish unsigned assets'
          }
          $publicKeyBase64 = 'MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEUCQv0in24CEgz0uiGoER/25EFZY5w/x0wvpl9TyRyG8VxFTqv3mKuGBxMwoknk9FBHrj2P9c56kCUU2POE5Glw=='

          $keyBytes = [Convert]::FromBase64String($env:UPDATE_SIGNING_KEY.Trim())
          $signingKey = [System.Security.Cryptography.ECDsa]::Create()
          $verifier = [System.Security.Cryptography.ECDsa]::Create()
          try {
            $read = 0
            $signingKey.ImportPkcs8PrivateKey($keyBytes, [ref] $read)
            if ($read -ne $keyBytes.Length) {
              throw 'UPDATE_SIGNING_KEY has trailing data after the PKCS#8 private key'
            }
            $read = 0
            $verifier.ImportSubjectPublicKeyInfo([Convert]::FromBase64String($publicKeyBase64), [ref] $read)

            foreach ($file in @($versionedSetup, $versionedZip)) {
              $bytes = [System.IO.File]::ReadAllBytes($file)
              $hash = [System.Security.Cryptography.SHA256]::HashData($bytes)
              $signature = $signingKey.SignHash($hash)
              [System.IO.File]::WriteAllText(
                "$file.sig", [Convert]::ToBase64String($signature), [System.Text.Encoding]::ASCII)
              if (-not $verifier.VerifyHash($hash, $signature)) {
                throw "signature verification failed for $(Split-Path $file -Leaf) against the embedded UpdateKey public key"
              }
              Write-Host "signed and verified: $(Split-Path $file -Leaf).sig ($($signature.Length) bytes)"
            }
          } finally {
            $signingKey.Dispose()
            $verifier.Dispose()
            [Array]::Clear($keyBytes, 0, $keyBytes.Length)
          }

          # SHA256SUMS.txt covers the five other assets, never itself, in sha256sum format:
          # <64 lower-case hex><two spaces><file name>.
          $assetNames = @(
            "DropWheel-$version-portable-win-x64.zip"
            "DropWheel-$version-portable-win-x64.zip.sig"
            "DropWheel-$version-Setup.exe"
            "DropWheel-$version-Setup.exe.sig"
            'DropWheel-Setup.exe'
          )
          $staged = @(Get-ChildItem $stage -File | Select-Object -ExpandProperty Name)
          foreach ($name in $assetNames) {
            if ($staged -notcontains $name) { throw "staged asset missing: $name" }
          }
          if ($staged.Count -ne 5) {
            throw "expected 5 staged assets before SHA256SUMS.txt, found: $($staged -join ', ')"
          }
          $lines = foreach ($name in ($assetNames | Sort-Object)) {
            $hash = (Get-FileHash (Join-Path $stage $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $stage 'SHA256SUMS.txt'), (($lines -join "`n") + "`n"), [System.Text.Encoding]::ASCII)

          Write-Host 'staged release assets:'
          Get-ChildItem $stage -File | Sort-Object Name | ForEach-Object {
            Write-Host ("  {0}  {1:N0} bytes" -f $_.Name, $_.Length)
          }
          Get-Content (Join-Path $stage 'SHA256SUMS.txt') | ForEach-Object { Write-Host "  sums: $_" }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $tag = $env:GITHUB_REF_NAME
          $repo = '${{ github.repository }}'
          $stage = Join-Path $env:RUNNER_TEMP 'release-assets'
          $version = $env:VERSION
          if (-not $version) { throw 'VERSION was not set by the staging step' }

          $expected = @(
            "DropWheel-$version-portable-win-x64.zip"
            "DropWheel-$version-portable-win-x64.zip.sig"
            "DropWheel-$version-Setup.exe"
            "DropWheel-$version-Setup.exe.sig"
            'DropWheel-Setup.exe'
            'SHA256SUMS.txt'
          )
          $actual = @(Get-ChildItem $stage -File | Select-Object -ExpandProperty Name)
          $difference = Compare-Object ($expected | Sort-Object) ($actual | Sort-Object)
          if ($difference) { throw "staged asset set mismatch: $($difference | Out-String)" }
          $files = @($expected | ForEach-Object { Join-Path $stage $_ })

          # Replace an earlier release for this tag (the tag itself is never touched).
          gh release view $tag --repo $repo --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag already exists; deleting it first"
            gh release delete $tag --repo $repo --yes
            if ($LASTEXITCODE -ne 0) { throw "gh release delete $tag failed" }
          }

          gh release create $tag --repo $repo --title "DropWheel $tag" --generate-notes @files
          if ($LASTEXITCODE -ne 0) { throw "gh release create $tag failed" }

          # Read the release back: the job must publish exactly those six names, and the summary lists them.
          $release = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $release = gh release view $tag --repo $repo --json assets | ConvertFrom-Json
            if (@($release.assets).Count -eq 6) { break }
            Start-Sleep -Seconds 3
          }
          $uploaded = @($release.assets | Select-Object -ExpandProperty name)
          if ($uploaded.Count -ne 6) {
            throw "expected 6 uploaded assets, found $($uploaded.Count): $($uploaded -join ', ')"
          }
          $difference = Compare-Object ($expected | Sort-Object) ($uploaded | Sort-Object)
          if ($difference) { throw "uploaded asset set mismatch: $($difference | Out-String)" }

          $summary = @("### GitHub release $tag", '', '| asset | bytes |', '| --- | ---: |')
          foreach ($asset in ($release.assets | Sort-Object name)) {
            $summary += "| $($asset.name) | $($asset.size) |"
          }
          $summary += ''
          $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Write-Host "release $tag published with exactly 6 assets:"
          $release.assets | Sort-Object name | ForEach-Object { Write-Host "  - $($_.name)" }
