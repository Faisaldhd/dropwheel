name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-test:
    name: Build + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure .NET 10 SDK
        shell: pwsh
        run: |
          # windows-latest already ships a recent SDK; only install if .NET 10 is missing.
          # (actions/setup-dotnet can hang fetching the SDK, so it is not used here.)
          $sdks = dotnet --list-sdks
          $sdks | Write-Host
          if (-not ($sdks -match '^10\.')) {
            Write-Host "No .NET 10 SDK on the image; installing one."
            choco install dotnet-10.0-sdk --no-progress -y
            refreshenv
          }
          dotnet --version

      - name: Restore
        shell: pwsh
        run: |
          # In a multi-line pwsh step only the LAST command's exit code decides success, so every
          # command is checked explicitly (a failing App build once slipped through this way).
          dotnet restore src/FileAction.App/FileAction.App.csproj
          if ($LASTEXITCODE -ne 0) { throw "restore App failed" }
          dotnet restore tests/FileAction.Tests/FileAction.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw "restore Tests failed" }

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/FileAction.Core/FileAction.Core.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "build Core failed" }
          dotnet build src/FileAction.App/FileAction.App.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "build App failed" }
          dotnet build tests/FileAction.Tests/FileAction.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "build Tests failed" }

      - name: Install FFmpeg and Pandoc (integration tests)
        # Best effort: the community Chocolatey feed regularly answers 503. The integration tests skip the
        # samples whose tool is missing, so a feed outage must not turn the build red.
        continue-on-error: true
        shell: pwsh
        run: |
          choco install ffmpeg pandoc --no-progress -y
          $env:PATH = "$env:PATH;$env:ProgramData\chocolatey\bin"
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { ffmpeg -version | Select-Object -First 1 }
          else { Write-Warning "ffmpeg is not available; its samples will be skipped" }
          if (Get-Command pandoc -ErrorAction SilentlyContinue) { pandoc --version | Select-Object -First 1 }
          else { Write-Warning "pandoc is not available; its samples will be skipped" }

      - name: Test
        shell: pwsh
        run: >
          dotnet test tests/FileAction.Tests/FileAction.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package (framework-dependent setup)
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure .NET 10 SDK
        shell: pwsh
        run: |
          # windows-latest already ships a recent SDK; only install if .NET 10 is missing.
          # (actions/setup-dotnet can hang fetching the SDK, so it is not used here.)
          $sdks = dotnet --list-sdks
          $sdks | Write-Host
          if (-not ($sdks -match '^10\.')) {
            Write-Host "No .NET 10 SDK on the image; installing one."
            choco install dotnet-10.0-sdk --no-progress -y
            refreshenv
          }
          dotnet --version

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src/FileAction.App/FileAction.App.csproj
          $version = ($csproj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $version) { throw "no <Version> in FileAction.App.csproj" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "version = $version"

      - name: Publish (framework-dependent)
        shell: pwsh
        run: |
          dotnet publish src/FileAction.App/FileAction.App.csproj `
            -c Release -r win-x64 --self-contained false `
            -o release/DropWheel
          if (-not (Test-Path release/DropWheel/DropWheel.exe)) { throw "publish produced no DropWheel.exe" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          # "${env:ProgramFiles(x86)}" must use braces: "$env:ProgramFiles(x86)" expands the variable
          # name only up to the bracket and produces "C:\Program Files(x86)".
          $roots = @(
            ${env:ProgramFiles(x86)},
            $env:ProgramFiles,
            (Join-Path $env:LOCALAPPDATA 'Programs')
          ) | Where-Object { $_ -and (Test-Path $_) }

          $iscc = $roots |
            ForEach-Object { Join-Path $_ 'Inno Setup 6\ISCC.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $iscc) {
            $iscc = Get-ChildItem $roots -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) {
            Get-ChildItem 'C:\ProgramData\chocolatey' -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "candidate: $($_.FullName)" }
            throw "ISCC.exe not found after 'choco install innosetup'"
          }
          Write-Host "ISCC: $iscc"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer/DropWheel.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Size report
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $publish = Get-ChildItem release/DropWheel -Recurse -File
          $publishMb = [math]::Round((($publish | Measure-Object Length -Sum).Sum / 1MB), 1)
          $setup = Get-Item "release/DropWheel-Setup-$version.exe"
          $setupMb = [math]::Round($setup.Length / 1MB, 2)
          $winrt = Test-Path release/DropWheel/Microsoft.Windows.SDK.NET.dll

          @"
          ### DropWheel $version package sizes

          | item | size | files |
          | --- | --- | --- |
          | publish (framework-dependent, win-x64) | $publishMb MB | $($publish.Count) |
          | setup exe | $setupMb MB | 1 |
          | Microsoft.Windows.SDK.NET.dll | $(if ($winrt) { "present" } else { "absent" }) | - |
          "@ >> $env:GITHUB_STEP_SUMMARY

          Write-Host "publish: $publishMb MB / $($publish.Count) files"
          Write-Host "setup:   $setupMb MB"
          if ($setupMb -gt 30) {
            Write-Warning "setup is $setupMb MB, above the 30 MB target of R-2"
          }

      - name: Portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path release/DropWheel/* -DestinationPath "release/DropWheel-portable-$version.zip" -Force
          Get-Item "release/DropWheel-portable-$version.zip" | Select-Object Name, Length

      # R-23: a truly portable build — self-contained, so it runs with no .NET install, no installer,
      # no registry, no admin. Settings stay next to the exe when portable.txt is present.
      - name: Portable zip (self-contained, no admin)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          dotnet publish src/FileAction.App/FileAction.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -o portable/DropWheel
          if (-not (Test-Path portable/DropWheel/DropWheel.exe)) { throw "self-contained publish produced no exe" }
          Set-Content portable/DropWheel/portable.txt "DropWheel portable build: settings and downloaded tools stay in this folder."
          Compress-Archive -Path portable/DropWheel/* -DestinationPath "release/DropWheel-$version-portable-win-x64.zip" -Force
          $zip = Get-Item "release/DropWheel-$version-portable-win-x64.zip"
          Write-Host ("portable self-contained zip: {0:N1} MB" -f ($zip.Length / 1MB))
          "| portable zip (self-contained, no admin) | $([math]::Round($zip.Length / 1MB, 1)) MB | 1 |" >> $env:GITHUB_STEP_SUMMARY

      - name: SHA256SUMS
        if: always()
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          if (-not $files) { throw "no installer or zip to hash" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt
      - name: Upload setup
        uses: actions/upload-artifact@v4
        with:
          name: DropWheel-Setup-${{ steps.version.outputs.version }}
          path: |
            release/DropWheel-Setup-*.exe
            release/*portable*.zip
            release/SHA256SUMS.txt
          retention-days: 14

      - name: Diagnose report
        continue-on-error: true
        shell: pwsh
        run: |
          # R-18: the report is what the owner sends back when the app misbehaves on a locked-down PC.
          # DropWheel is a GUI subsystem exe: "& exe" does not wait and leaves $LASTEXITCODE stale, so use
          # Start-Process -Wait and verify the report file instead of the shell's exit code.
          $process = Start-Process -FilePath release/DropWheel/DropWheel.exe `
            -ArgumentList '--diagnose', (Join-Path $PWD 'release/diagnose.txt') -PassThru
          if (-not $process.WaitForExit(90000)) { Write-Warning 'diagnose did not exit in 90 s'; try { $process.Kill($true) } catch { } }
          Write-Host "diagnose exit code: $($process.ExitCode)"
          if (-not (Test-Path release/diagnose.txt)) { throw "--diagnose wrote no report" }
          Get-Content release/diagnose.txt | Select-Object -First 40

      - name: Upload diagnose
        uses: actions/upload-artifact@v4
        with:
          name: diagnose
          path: release/diagnose.txt
          retention-days: 14

  screenshots:
    name: Screenshots (needs a desktop session)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure .NET 10 SDK
        shell: pwsh
        run: |
          # windows-latest already ships a recent SDK; only install if .NET 10 is missing.
          # (actions/setup-dotnet can hang fetching the SDK, so it is not used here.)
          $sdks = dotnet --list-sdks
          $sdks | Write-Host
          if (-not ($sdks -match '^10\.')) {
            Write-Host "No .NET 10 SDK on the image; installing one."
            choco install dotnet-10.0-sdk --no-progress -y
            refreshenv
          }
          dotnet --version

      - name: Publish
        shell: pwsh
        run: dotnet publish src/FileAction.App/FileAction.App.csproj -c Release -r win-x64 --self-contained false -o release/DropWheel

      - name: Render screenshots
        shell: pwsh
        run: |
          & release/DropWheel/DropWheel.exe --self-test docs/screenshots
          if ($LASTEXITCODE -ne 0) { throw "--self-test failed with $LASTEXITCODE" }

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            docs/screenshots/**/*.png
            docs/screenshots/**/self-test.txt
          retention-days: 14

  release:
    name: GitHub release (tag)
    # R-24: pushing a vX.Y.Z tag publishes the installer and both portable zips as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem dist -Recurse -Include *.exe,*.zip,*.txt | Select-Object -ExpandProperty FullName
          if (-not $files) { throw "no installer or zip found in the uploaded artifacts" }
          $files | ForEach-Object { Write-Host "release asset: $_" }
          gh release create $tag --repo ${{ github.repository }} --title "DropWheel $tag" --generate-notes @files
          Write-Host "created release $tag"
