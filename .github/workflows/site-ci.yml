name: Site CI

# Static-site gates for docs/site.  The page itself is owned by the website
# lead; this workflow only measures it.  If a gate fails because of page
# content, report the finding instead of weakening the gate.
on:
  pull_request:
    paths:
      - 'docs/site/**'
      - 'scripts/site/**'
      - 'docs/website/CI.md'
      - '.github/workflows/site-ci.yml'
  push:
    branches:
      - 'site/**'
      - 'feat/2.4.0-website'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size-budget:
    name: Size budget (<= 500,000 B)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure initial-document payload
        run: |
          set -euo pipefail
          python scripts/site/size_budget.py --root docs/site | tee "$RUNNER_TEMP/size-budget.txt"
          {
            echo '### Size budget'
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/size-budget.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check internal and external links
        run: |
          set -euo pipefail
          python scripts/site/check_links.py --root docs/site --timeout 20 --retries 2 | tee "$RUNNER_TEMP/link-check.txt"
          {
            echo '### Link check'
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/link-check.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lighthouse:
    name: Lighthouse desktop (all categories >= 0.95)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Write Lighthouse CI config
        run: |
          cat > lighthouserc.json <<'JSON'
          {
            "ci": {
              "collect": {
                "staticDistDir": "./docs/site",
                "numberOfRuns": 2,
                "settings": {
                  "preset": "desktop",
                  "chromeFlags": "--no-sandbox --disable-dev-shm-usage"
                }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["error", {"minScore": 0.95, "aggregationMethod": "optimistic"}],
                  "categories:accessibility": ["error", {"minScore": 0.95, "aggregationMethod": "optimistic"}],
                  "categories:best-practices": ["error", {"minScore": 0.95, "aggregationMethod": "optimistic"}],
                  "categories:seo": ["error", {"minScore": 0.95, "aggregationMethod": "optimistic"}]
                }
              }
            }
          }
          JSON
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: lighthouserc.json
          uploadArtifacts: 'true'
          artifactName: lighthouse-report

  screenshots:
    name: Page screenshots (1440 / 390)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.48.2
          npx --yes playwright@1.48.2 install --with-deps chromium
      - name: Capture full-page screenshots
        run: |
          set -euo pipefail
          mkdir -p site-artifacts/screenshots
          cat > "$RUNNER_TEMP/capture.cjs" <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const targets = [
              { width: 1440, height: 900, file: 'home-1440-dark.png' },
              { width: 390, height: 844, file: 'home-390-dark.png' },
            ];
            for (const target of targets) {
              const page = await browser.newPage({
                viewport: { width: target.width, height: target.height },
                colorScheme: 'dark',
              });
              await page.goto('http://127.0.0.1:8080/', { waitUntil: 'load' });
              await page.waitForTimeout(500);
              // The page reveals sections with IntersectionObserver; scroll the
              // whole document so the full-page capture is not blank below the fold.
              await page.evaluate(async () => {
                const step = Math.max(200, window.innerHeight * 0.8);
                for (let y = 0; y < document.body.scrollHeight; y += step) {
                  window.scrollTo(0, y);
                  await new Promise((resolve) => setTimeout(resolve, 80));
                }
                window.scrollTo(0, 0);
              });
              await page.waitForTimeout(800);
              await page.screenshot({
                path: `site-artifacts/screenshots/${target.file}`,
                fullPage: true,
              });
              await page.close();
            }
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS
          python3 -m http.server 8080 --directory docs/site --bind 127.0.0.1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 0.2
          done
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node "$RUNNER_TEMP/capture.cjs"
          ls -lh site-artifacts/screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: site-artifacts/screenshots
          if-no-files-found: warn
          retention-days: 14
